<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis solicitudes | Farmacias del Sombrero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body data-page="solicitudes">

<div id="site-disclaimer"></div>
<header id="site-header" class="site-header"></header>

<main>
  <section class="pagina-hero">
    <div class="contenedor">
      <p class="section-eyebrow">Mis solicitudes</p>
      <h1>Medicamentos que has apartado</h1>
      <p>Aquí ves el estado de cada solicitud. Si no pasas por tu medicamento en 72 horas, la solicitud se cancela y se libera.</p>
    </div>
  </section>

  <section>
    <div class="contenedor" style="max-width:820px;">
      <div class="solicitudes-lista" id="solicitudes-lista" aria-live="polite"></div>

      <div class="herramientas-demo">
        <span>Herramientas de demostración:</span>
        <button type="button" class="btn-secundario" id="btn-simular">Simular que pasaron 72 horas</button>
        <button type="button" class="btn-texto" id="btn-borrar">Borrar datos de prueba</button>
      </div>
      <p class="ayuda" id="resultado-demo" role="status" style="margin-top:10px"></p>
      <p class="nota-prototipo">Las solicitudes se guardan solo en este navegador. En la versión final vivirán en un servidor.</p>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script type="module" src="js/pages/solicitudes.js"></script>
</body>
</html>
